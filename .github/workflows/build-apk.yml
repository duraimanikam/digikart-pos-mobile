name: Build Android APK

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Install Dependencies
        run: npm install

      - name: 6. Verify TypeScript Types
        run: npx tsc --noEmit

      - name: 7. Generate Native Android Project (CNG)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 8. Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 9. Build Standalone Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace -Pexpo.useLegacyPackaging=true -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cd ..
          mkdir -p release-apk
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-apk/DigiKart-POS-v1.1.0-Release.apk
            echo "Successfully prepared release-apk/DigiKart-POS-v1.1.0-Release.apk"
          fi
          ls -lh release-apk/

      - name: 10. Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DigiKart-POS-v1.1.0-Release-APK
          path: release-apk/*.apk
          retention-days: 30

      - name: 11. Publish to GitHub Releases (Direct 1-Click Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: DigiKart POS v1.1.0 (Commercial Edition)
          draft: false
          prerelease: false
          body: |
            ## 🚀 DigiKart POS v1.1.0 Commercial Edition

            ### ✨ What's New in this Version:
            - **Dedicated Continuous Laser Barcode & QR Code Scanner** (1D EAN/UPC/Code128 + 2D QR Code).
            - **Voice-to-Item Entry** in Billing (`NewBillScreen`), Product Master (`ProductDetailsScreen`), and Purchase Entry (`DetailedPurchaseEntryScreen`).
            - **Bluetooth Thermal Printer Direct Streaming** (Lists paired Bluetooth devices like POS-80, XP-58, TSC TE244, TVS RP-3150 instead of system Wi-Fi spooler).
            - **ESC/POS & TSC TSPL Protocols** (Supports both receipt rolls and barcode sticker labels).
            - **Complete Demo Reset** (Post-Demo Client Handover) in Settings to wipe mock bills and restore clean catalog.
            - **TamilVelai Brand Colors** (Dark Navy Blue `#0A2540` & Vibrant Orange `#FF6600`).
            - **Admin Password Change** feature in Settings.
            - **Fixed Android Status Bar Overlay** padding across all screens.

            ### 📲 Direct APK Download:
            Download **`DigiKart-POS-v1.1.0-Release.apk`** below.
            *(If you already have an older build installed on your phone, uninstall the old app first before installing this new APK).*
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eas-cloud-build:
    name: Optional EAS Cloud Build (If EXPO_TOKEN is configured)
    needs: build-apk
    if: false # Set to true if you add EXPO_TOKEN to your GitHub Repository Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm install

      - name: Build Standalone APK on EAS Cloud
        run: eas build --platform android --profile preview --non-interactive
